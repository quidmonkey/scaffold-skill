# pre-push is required for the pytest and code-review hooks below, and
# prepare-commit-msg for the decision-history hook.
default_install_hook_types: [pre-commit, pre-push, prepare-commit-msg]
# Hooks without their own `stages:` run at commit only. Without this they would
# also run at every installed stage above, so ty and bandit ran again on
# prepare-commit-msg and pre-push.
default_stages: [pre-commit]
# Stop at the first failing hook: the paid code review runs last and shouldn't
# spend a model run on a push that pytest or run-check has already blocked.
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run --no-sync ty check {{lint-target}}
        language: system
        pass_filenames: false

      - id: bandit
        name: bandit security scan
        entry: uv run --no-sync bandit -r {{lint-target}}{{bandit-exclude-arg}} --configfile pyproject.toml
        language: system
        pass_filenames: false

      # pytest exits 5 when it collects no tests, which would block the first
      # push of a fresh scaffold; no tests yet is a pass, not a failure.
      - id: pytest
        name: pytest
        entry: bash -c 'uv run --no-sync pytest {{test-dir}} --tb=short; rc=$?; [ "$rc" -eq 5 ] && exit 0; exit "$rc"'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: run-check
        name: app run check
        entry: make run-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: decision-history
        name: list prior decisions in the commit message
        entry: bash scripts/decisions-commit-msg.sh
        language: system
        always_run: true
        stages: [prepare-commit-msg]

      - id: code-review
        name: agentic code review (two-pass)
        entry: bash scripts/code-review.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
